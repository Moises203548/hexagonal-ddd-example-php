name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Verificar sintaxis PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Construir imagen Docker
        run: docker build -t crud-canciones .
  # Despliegue en Render: activar "Auto-Deploy" en el servicio, o guardar el Deploy Hook
